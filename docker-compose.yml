# Local PostgreSQL for development. `npm run start` starts it when Docker is installed.
# The values match DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: freight
    ports:
      - "5432:5432"
    volumes:
      - freight-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freight"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  freight-pg:
